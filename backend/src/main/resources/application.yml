server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: tcm-platform
  servlet:
    multipart:
      max-file-size: ${SOURCE_MAX_ORIGINAL_BYTES:52428800}B
      max-request-size: 53MB
      file-size-threshold: 0B
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/tcm_learning?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:tcm}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      maximum-pool-size: 10
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
tcm:
  jobs:
    enabled: ${JOBS_ENABLED:true}
  source:
    limits:
      max-original-bytes: ${SOURCE_MAX_ORIGINAL_BYTES:52428800}
      max-expanded-bytes: ${SOURCE_MAX_EXPANDED_BYTES:209715200}
      max-archive-entries: ${SOURCE_MAX_ARCHIVE_ENTRIES:5000}
      max-compression-ratio: ${SOURCE_MAX_COMPRESSION_RATIO:200}
  storage:
    source-temp-directory: ${SOURCE_TEMP_DIR:${java.io.tmpdir}/tcm-source-staging}
    minio:
      endpoint: ${TCM_MINIO_ENDPOINT:http://127.0.0.1:19000}
      bucket: ${TCM_MINIO_BUCKET:tcm-learning-sources}
      access-key: ${TCM_MINIO_APP_ACCESS_KEY:}
      secret-key: ${TCM_MINIO_APP_SECRET_KEY:}
    avatar-directory: ${AVATAR_STORAGE_DIR:${java.io.tmpdir}/tcm-platform-avatars}
    source-directory: ${SOURCE_STORAGE_DIR:${java.io.tmpdir}/tcm-platform-sources}
  security:
    jwt-secret: ${JWT_SECRET}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    cookie-secure: ${COOKIE_SECURE:true}
    access-seconds: 900
    refresh-days: 7
    session-absolute-days: 30
  ai:
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${AI_INTERNAL_TOKEN}
