server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: tcm-platform
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/tcm_learning?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:tcm}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      maximum-pool-size: 10
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
tcm:
  storage:
    avatar-directory: ${AVATAR_STORAGE_DIR:${java.io.tmpdir}/tcm-platform-avatars}
  security:
    jwt-secret: ${JWT_SECRET}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    cookie-secure: ${COOKIE_SECURE:true}
    access-seconds: 900
    refresh-days: 7
    session-absolute-days: 30
  ai:
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${AI_INTERNAL_TOKEN}
